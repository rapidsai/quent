[package]
name = "quent-open"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Open archive inputs (tar family or zip) in `local` mode by extracting and
# scanning them for telemetry. Pulls in the archive/codec crates.
archive = ["dep:tar", "dep:flate2", "dep:zstd", "dep:zip", "dep:tempfile"]
# Non-local mode: fetch a run's telemetry from the (internal RAPIDS/NVIDIA)
# Benchmarking API database (extracts assets, so it enables `archive`). Off by
# default; irrelevant to non-NVIDIA users.
db = ["archive", "dep:reqwest", "dep:serde", "dep:uuid", "dep:dotenvy"]

[dependencies]
backon = "1"
cargo-manifest = "0.21"
clap = { version = "4.5.58", features = ["derive", "env"] }
dirs = "6"
dotenvy = { version = "0.15", optional = true }
flate2 = { version = "1", optional = true }
gix-url = "0.36"
open = "5"
prettyplease.workspace = true
quent-build-info = { path = "../build-info" }
quote = "1"
# `rustls-tls-native-roots` (OS trust store) rather than `rustls-tls` (bundled
# webpki-roots): fits an internal CA, and avoids webpki-roots' CDLA-Permissive
# license (rejected by cargo-deny).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json.workspace = true
syn.workspace = true
tar = { version = "0.4", optional = true }
tempfile = { version = "3", optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
toml = "1.1"
uuid = { version = "1", optional = true }
walkdir = "2"
zip = { version = "3", default-features = false, features = ["deflate", "deflate64", "zstd"], optional = true }
zstd = { version = "0.13", optional = true }

[dev-dependencies]
tempfile = "3"
