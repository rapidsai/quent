[package]
name = "quent-instrumentation"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
clock-quanta = ["quent-time/clock-quanta"]
channel-per-thread = ["dep:quent-channel", "tokio/time"]
serde = [
    "dep:serde",
    "quent-events/serde",
    "quent-dynamic-attributes/serde",
    "uuid/serde",
]
# Optional I/O integrations.
io-callback = ["dep:quent-io-callback"]
io-ndjson = ["quent-io/ndjson", "serde"]
io-msgpack = ["quent-io/msgpack", "serde"]
io-postcard = ["quent-io/postcard", "serde"]
io-collector = ["dep:quent-collector-client", "quent-io/collector", "serde"]

[dependencies]
async-trait.workspace = true
quent-dynamic-attributes = { path = "../dynamic-attributes" }
quent-build-info = { path = "../build-info" }
quent-channel = { path = "../channel", optional = true }
quent-collector-client = { workspace = true, optional = true }
quent-events = { path = "../events", default-features = false }
quent-io = { path = "../io", default-features = false }
quent-io-callback = { path = "../io/callback", optional = true }
quent-time = { path = "../time", default-features = false }
serde = { workspace = true, features = ["derive"], optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros"]}
tokio-util.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["serde"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

[dev-dependencies]
http.workspace = true
quent-collector = { path = "../collector/server" }
quent-collector-proto = { path = "../collector/proto" }
quent-events = { path = "../events", default-features = false, features = ["serde"] }
quent-io = { path = "../io", features = ["ndjson"] }
serde = { workspace = true, features = ["derive"] }
tempfile = "3"
tokio-stream.workspace = true
tonic.workspace = true
