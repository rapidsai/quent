[package]
name = "quent-instrumentation"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
serde = [
    "dep:serde",
    "quent-events/serde",
    "quent-attributes/serde",
    "uuid/serde",
]
# Exporter backends, forwarded to the matching `quent-io` feature.
io-callback = ["quent-io/callback"]
io-ndjson = ["quent-io/ndjson", "serde"]
io-msgpack = ["quent-io/msgpack", "serde"]
io-postcard = ["quent-io/postcard", "serde"]
io-collector = ["quent-io/collector", "serde"]

[dependencies]
quent-attributes = { path = "../attributes" }
quent-build-info = { path = "../build-info" }
quent-events = { path = "../events" }
quent-io = { path = "../io", default-features = false }
serde = { workspace = true, features = ["derive"], optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros"]}
tokio-util.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
http.workspace = true
pprof = { version = "0.14", features = ["flamegraph"] }
quent-collector = { path = "../collector/server" }
quent-collector-proto = { path = "../collector/proto" }
quent-events = { path = "../events", features = ["serde"] }
quent-io = { path = "../io", features = ["callback", "ndjson"] }
serde = { workspace = true, features = ["derive"] }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-stream.workspace = true
tonic.workspace = true

[[bench]]
name = "event_emit"
harness = false
