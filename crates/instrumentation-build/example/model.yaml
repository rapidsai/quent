# The event model, authored in YAML and compiled to instrumentation at build time.

quent: alpha
model: demo
doc: Instrumentation model of the demo connection server.

records:
  Endpoint:
    doc: A network endpoint.
    fields:
      host: string
      port: u16
  Meta:
    fields:
      tags: { list: string }
      extra: dynamic
  Route:
    doc: Details of one routing edge to an upstream server.
    fields:
      hops: u8

entities:
  Server:
    doc: A server that accepts connections.
    events:
      booted:
        attributes:
          process: quent::os::Process

  ThreadPool:
    doc: A pool of threads owned by the server process.
    events:
      created:
        attributes:
          process: { scope-ref: Server }

  Thread:
    doc: An operating-system thread on which queries can run.
    resource: true
    events:
      started:
        attributes:
          thread: quent::os::Thread
          pool: { scope-ref: ThreadPool }

  Connection:
    doc: A client connection.
    events:
      opened:
        doc: The connection was accepted.
        attributes:
          peer: Endpoint
          session: uuid
          host: { scope-ref: Server }
      data:
        multi: true
        attributes:
          bytes: u64
          meta: { option: Meta }
      routed:
        doc: Forwarded to an upstream server.
        attributes:
          upstream: { ref: Server, data: Route }
      closed: {}

fsms:
  Query:
    doc: A query on the server, modeled as a finite-state machine.
    states:
      submitted:
        initial: true
        attributes:
          text: string
          connection: { scope-ref: Connection }
        to: [running]
      running:
        attributes:
          rows: u64
          thread: { uses: Thread }
        to: [running, ready]
      ready:
        attributes: { ok: bool }
