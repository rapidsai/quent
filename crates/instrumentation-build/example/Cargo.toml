# Its own workspace, excluded from the repo workspace, so its exporter feature
# graph stays callback-only (`Serialize`-free) instead of being unified with the
# repo's filesystem/collector exporters under `--workspace --all-features`.
[workspace]

[package]
name = "quent-instrumentation-build-example"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
quent-instrumentation = { path = "../../instrumentation", features = ["io-callback"] }

[build-dependencies]
quent-instrumentation-build = { path = ".." }
quent-yaml = { path = "../../yaml" }
