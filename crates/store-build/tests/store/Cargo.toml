[package]
name = "quent-store-build-entity-store-test"
version = "0.2.0"
edition = "2024"
publish = false

# A separate crate lets build.rs use quent-store-build without a dependency cycle.
[workspace]

[dependencies]
quent-store = {
    path = "../../../store",
    default-features = false,
    features = ["serde", "io-ndjson", "io-msgpack", "io-postcard"],
}

[dev-dependencies]
quent-ref-tree = { path = "../../../ref-tree", features = ["analysis"] }
quent-instrumentation-build-example = { path = "../../../instrumentation-build/example" }
tempfile = "3"

[build-dependencies]
quent-schema = { path = "../../../schema", features = ["test-utils"] }
quent-store-build = { path = "../.." }
quent-yaml = { path = "../../../yaml" }
