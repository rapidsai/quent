[package]
name = "quent-store-build-entity-store-test"
version = "0.0.0"
edition = "2024"
publish = false

# A separate crate lets build.rs use quent-store-build without a dependency cycle.
[workspace]

[features]
default = ["serde"]
# Serde-enabled builds also compile the filesystem-loading combinations.
serde = ["quent-store/serde", "quent-store/io-ndjson", "quent-store/io-msgpack", "quent-store/io-postcard"]

[dependencies]
quent-store = { path = "../../../store", default-features = false }

[dev-dependencies]
quent-instrumentation-build-example = { path = "../../../instrumentation-build/example" }
tempfile = "3"

[build-dependencies]
quent-schema = { path = "../../../schema", features = ["test-utils"] }
quent-store-build = { path = "../.." }
quent-yaml = { path = "../../../yaml" }
