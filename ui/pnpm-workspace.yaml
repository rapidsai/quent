packages:
  - 'packages/@quent/*'
  # Examples (under ui/examples/) are intentionally NOT part of this
  # workspace. They are opt-in: their dependencies are not installed by
  # `pnpm install` here and they are not built by `pnpm ci:check`. To work
  # on an example, run pnpm from inside its folder, where a nested
  # `pnpm-workspace.yaml` re-references `../../packages/@quent/*` so its
  # `workspace:*` deps still resolve to source.

catalog:
  '@tanstack/react-query': ^5.104.2
  '@tanstack/react-router': ^1.170.42
  '@tanstack/react-table': ^9.2.8
  '@tanstack/react-virtual': ^3.14.17
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@xyflow/react': ^12.12.0
  clsx: ^2.1.1
  echarts: ^6.1.0
  echarts-for-react: ^3.0.6
  jotai: ^3.0.1
  jotai-family: ^1.1.0
  react: ^19.3.0
  react-dom: ^19.3.0
  tailwind-merge: ^3.7.0
  tsdown: ^0.23.1
  typescript: ^6.0.3

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  msw: true
  protobufjs: true

overrides:
  # solid-js@1.9.15 pins seroval to ~1.5.4, excluding patched releases.
  'solid-js>seroval': ^1.6.3

minimumReleaseAgeExclude:
  - undici@8.12.2
