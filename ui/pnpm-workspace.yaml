packages:
  - 'packages/@quent/*'
  # Examples (under ui/examples/) are intentionally NOT part of this
  # workspace. They are opt-in: their dependencies are not installed by
  # `pnpm install` here and they are not built by `pnpm ci:check`. To work
  # on an example, run pnpm from inside its folder, where a nested
  # `pnpm-workspace.yaml` re-references `../../packages/@quent/*` so its
  # `workspace:*` deps still resolve to source.

catalog:
  '@tanstack/react-query': ^5.101.4
  '@tanstack/react-router': ^1.170.29
  '@tanstack/react-table': ^9.1.2
  '@tanstack/react-virtual': ^3.14.10
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@xyflow/react': ^12.11.3
  clsx: ^2.1.1
  echarts: ^6.1.0
  echarts-for-react: ^3.0.6
  jotai: ^2.20.2
  jotai-family: ^1.1.0
  react: ^19.2.8
  react-dom: ^19.2.8
  tailwind-merge: ^3.6.0
  tsdown: ^0.22.14
  typescript: ^6.0.3

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  msw: true
  protobufjs: true
