[package]
name = "quent-simulator-wasm"
version.workspace = true
edition.workspace = true
publish = false

[features]
generate = [
    "dep:quent-instrumentation",
    "dep:quent-browser-bundle-build",
    "dep:quent-simulator",
    "dep:quent-simulator-instrumentation",
    "dep:tempfile",
    "quent-simulator-store/filesystem",
]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "generate-demo"
path = "src/bin/generate.rs"
required-features = ["generate"]

[dependencies]
postcard.workspace = true
quent-browser-bundle.workspace = true
quent-browser-bundle-build = { workspace = true, optional = true }
quent-events = { path = "../../../../crates/events", features = ["serde"] }
quent-instrumentation = { path = "../../../../crates/instrumentation", optional = true }
quent-query-engine-analyzer = { path = "../../../../domains/query_engine/analyzer" }
quent-query-engine-browser.workspace = true
quent-simulator-analyzer = { path = "../analyzer", default-features = false }
quent-simulator-instrumentation = { path = "../instrumentation", optional = true }
quent-simulator-store = { path = "../store", default-features = false }
quent-simulator = { path = "../application", optional = true }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
tempfile = { version = "3", optional = true }

[dev-dependencies]
uuid.workspace = true
