[package]
name = "quent-simulator-instrumentation"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
collector = ["dep:quent-collector-client", "quent-instrumentation/io-collector"]

[dependencies]
quent-collector-client = { workspace = true, optional = true }
quent-events = { workspace = true, features = ["serde"] }
quent-instrumentation = { path = "../../../../crates/instrumentation", features = [
    "io-msgpack",
    "io-ndjson",
    "io-postcard",
] }
quent-nvtx-events = { path = "../../../../integrations/nvtx/events" }
serde = { workspace = true, features = ["derive"] }
uuid = { workspace = true, features = ["serde", "v7"] }

[build-dependencies]
quent-instrumentation-build = { path = "../../../../crates/instrumentation-build" }
quent-yaml = { path = "../../../../crates/yaml" }

[dev-dependencies]
bitcode.workspace = true
quent-collector-client = { workspace = true }
quent-instrumentation = { path = "../../../../crates/instrumentation", features = ["io-callback"] }
quent-io = { path = "../../../../crates/io" }
quent-nvtx-analyzer = { path = "../../../../integrations/nvtx/analyzer" }
tempfile = "3"
