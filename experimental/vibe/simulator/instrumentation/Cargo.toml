[package]
name = "quent-simulator-instrumentation"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
collector = ["quent-instrumentation/io-collector"]

[dependencies]
nvtx-analyzer = { path = "../../../../integrations/nvtx/analyzer" }
nvtx-events = { path = "../../../../integrations/nvtx/events" }
quent-events = { workspace = true, features = ["serde"] }
quent-instrumentation = { path = "../../../../crates/instrumentation", features = [
    "io-msgpack",
    "io-ndjson",
    "io-postcard",
] }
serde = { workspace = true, features = ["derive"] }
uuid = { workspace = true, features = ["serde", "v7"] }

[target.'cfg(all(target_os = "linux", target_pointer_width = "64"))'.dependencies]
nvtx-injection = { path = "../../../../integrations/nvtx/injection", features = [
    "static-injection",
] }

[build-dependencies]
quent-instrumentation-build = { path = "../../../../crates/instrumentation-build" }
quent-yaml = { path = "../../../../crates/yaml" }

[dev-dependencies]
quent-collector-client = { workspace = true }
