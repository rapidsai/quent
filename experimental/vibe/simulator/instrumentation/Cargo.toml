[package]
name = "quent-simulator-instrumentation"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
collector = ["quent-instrumentation/io-collector"]

[dependencies]
quent-events = { workspace = true, features = ["serde"] }
quent-instrumentation = { path = "../../../../crates/instrumentation", features = [
    "io-msgpack",
    "io-ndjson",
    "io-postcard",
] }
serde = { workspace = true, features = ["derive"] }
uuid = { workspace = true, features = ["serde", "v7"] }

[build-dependencies]
quent-instrumentation-build = { path = "../../../../crates/instrumentation-build" }
quent-yaml = { path = "../../../../crates/yaml" }

[dev-dependencies]
quent-collector-client = { workspace = true }
