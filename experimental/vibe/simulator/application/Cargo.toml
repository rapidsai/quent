[package]
name = "quent-simulator"
version.workspace = true
edition.workspace =  true
publish.workspace = true
[dependencies]
clap = {version = "4.5.57", features = ["derive", "env"] }
petgraph.workspace = true
quent-dynamic-attributes = { path = "../../../../crates/dynamic-attributes" }
quent-io = { path = "../../../../crates/io", features = ["clap"] }
quent-simulator-instrumentation = { path = "../instrumentation" }
rand = "0.10.2"
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
tracing.workspace = true
uuid.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[target.'cfg(all(target_os = "linux", target_pointer_width = "64"))'.dependencies]
nvtx.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }
