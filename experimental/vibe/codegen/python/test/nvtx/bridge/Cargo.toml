[package]
name = "quent-codegen-python-nvtx-test-bridge"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "quent_codegen_nvtx_test"
crate-type = ["cdylib"]
test = false

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py311"] }
quent-codegen-nvtx-test-instrumentation = { path = "../../../../test/nvtx/instrumentation" }
quent-dynamic-attributes = { path = "../../../../../../../crates/dynamic-attributes" }
quent-instrumentation = {
    path = "../../../../../../../crates/instrumentation",
    features = ["serde", "io-ndjson"],
}
quent-io = { path = "../../../../../../../crates/io", default-features = false, features = ["ndjson"] }

[target.'cfg(all(target_os = "linux", target_pointer_width = "64"))'.dependencies]
nvtx = { version = "2", default-features = false, features = ["std"] }

[build-dependencies]
quent-schema-codegen-python = { path = "../../.." }
quent-yaml.workspace = true
