[package]
name = "quent-codegen-python-test-bridge"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["collector"]
collector = []

[lib]
name = "quent_codegen_test"
crate-type = ["cdylib"]
test = false

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py311"] }
quent-collector-python = { path = "../../../../../../crates/collector/python" }
quent-dynamic-attributes = { path = "../../../../../../crates/dynamic-attributes" }
quent-instrumentation = {
    path = "../../../../../../crates/instrumentation",
    features = ["serde", "io-ndjson", "io-collector"],
}
quent-io = { path = "../../../../../../crates/io", default-features = false, features = ["ndjson", "collector"] }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
quent-instrumentation-build = { path = "../../../../../../crates/instrumentation-build" }
quent-schema-codegen-python = { path = "../.." }
quent-yaml = { path = "../../../../../../crates/yaml" }
