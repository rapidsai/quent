[build-system]
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"

[project]
name = "quent-tutorial-operating-system"
version = "0.1.0"
requires-python = ">=3.11"

[tool.maturin]
manifest-path = "bridge/Cargo.toml"
module-name = "quent_tutorial_operating_system"
include = [
  { path = "quent_tutorial_operating_system/__init__.pyi", from = "out-dir", to = "" },
  { path = "quent_tutorial_operating_system/py.typed", from = "out-dir", to = "" },
]
