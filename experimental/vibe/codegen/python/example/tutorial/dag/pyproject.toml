[build-system]
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"

[project]
name = "quent-tutorial-dag"
version = "0.0.0"
requires-python = ">=3.11"

[tool.maturin]
manifest-path = "bridge/Cargo.toml"
module-name = "quent_tutorial_dag"
include = [
  { path = "quent_tutorial_dag/__init__.pyi", from = "out-dir", to = "" },
  { path = "quent_tutorial_dag/py.typed", from = "out-dir", to = "" },
]
