[package]
name = "quent-nvtx-cpp-test"
version.workspace = true
edition.workspace = true
publish.workspace = true

[target.'cfg(all(target_os = "linux", target_pointer_width = "64"))'.dependencies]
cxx = "1"
nvtx-injection = { path = "../../../../../../integrations/nvtx/injection", features = ["static-injection"] }
quent-nvtx-bridge = { path = "../../../../../../integrations/nvtx/bridge" }
quent-nvtx-sink = { path = "../../../../../../integrations/nvtx/sink" }
quent-dynamic-attributes = { path = "../../../../../../crates/dynamic-attributes" }
quent-instrumentation = { path = "../../../../../../crates/instrumentation", features = ["serde", "io-ndjson"] }
quent-io = { path = "../../../../../../crates/io", default-features = false, features = ["ndjson"] }
quent-events = { path = "../../../../../../crates/events" }
tempfile = "3"
uuid = "1"

[build-dependencies]
cxx-build = "1"
quent-instrumentation-build = { path = "../../../../../../crates/instrumentation-build" }
quent-schema-codegen-cpp = { path = "../.." }
quent-yaml = { path = "../../../../../../crates/yaml" }
