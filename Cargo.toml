[workspace]
resolver = "3"
members = [
    # Legacy PoC crates, scheduled for removal
    "crates/model",
    "crates/model-macros",
    # Application-agnostic crates
    "crates/analyzer",
    "crates/dynamic-attributes",
    "crates/build-info",
    "crates/codegen",
    "crates/collector/server",
    "crates/collector/client",
    "crates/collector/proto",
    "crates/events",
    "crates/io",
    "crates/io/callback",
    "crates/io/collector",
    "crates/io/msgpack",
    "crates/io/ndjson",
    "crates/io/postcard",
    "crates/io/types",
    "crates/instrumentation",
    "crates/open",
    "crates/stdlib",
    "crates/time",
    "crates/ui",
    # NVTX integration crates
    "integrations/nvtx/events",
    "integrations/nvtx/injection",
    "integrations/nvtx/bridge",
    "integrations/nvtx/example",
    "integrations/nvtx/analyzer",
    "integrations/nvtx/ui",
    "integrations/nvtx/server",
    # Domain-specific crates
    "domains/query_engine/analyzer",
    "domains/query_engine/model",
    "domains/query_engine/server",
    "domains/query_engine/ui",
    # Query engine C++ bridge test
    "domains/query_engine/tests/cpp/instrumentation",
    "domains/query_engine/tests/cpp/bridge",
    # Query engine Python bridge test
    "domains/query_engine/tests/python/instrumentation",
    "domains/query_engine/tests/python/bridge",
    # README example
    "examples/readme",
    # Legacy README example using model macros
    "examples/legacy/readme",
    # Legacy C++ integration example using the legacy README model
    "examples/legacy/cpp-integration/bridge",
    # Legacy Python integration example using the legacy README model
    "examples/legacy/python-integration/bridge",
    # Simulator crates
    "experimental/vibe/simulator/analyzer",
    "experimental/vibe/simulator/application",
    "experimental/vibe/simulator/instrumentation",
    "experimental/vibe/simulator/server",
    "experimental/vibe/simulator/ui",
    "experimental/vibe/simulator/ui-bindings",
    "experimental/vibe/simulator/wasm",
    # Deterministic query-engine event emitter (opt-in via `-p`).
    # Activates `quent-time/__test-clock-override`; excluded from default-members
    # so default builds keep `quent-time` zero-cost.
    "domains/query_engine/tests/fixed",
    # Unused preliminary crates of https://github.com/rapidsai/quent/issues/191
    "crates/constraints",
    "crates/schema",
    "crates/ref-target",
    "crates/ref-tree",
    "crates/fsm",
    "crates/resource",
    "crates/instrumentation-build",
    "crates/instrumentation-build/example",
    "crates/yaml",
    "crates/store",
    "crates/store-build",
    "crates/store-build/example"
]

# default-members excludes any crate that activates `quent-time/__test-clock-override`.
# `cargo build` and `cargo test` (no -p, no --workspace) skip those crates, preserving
# the zero-cost guarantee for everything else. Use `cargo build -p <crate>` to opt in.
default-members = [
    "crates/analyzer",
    "crates/dynamic-attributes",
    "crates/build-info",
    "crates/codegen",
    "crates/collector/server",
    "crates/collector/client",
    "crates/collector/proto",
    "crates/events",
    "crates/io",
    "crates/io/callback",
    "crates/io/collector",
    "crates/io/msgpack",
    "crates/io/ndjson",
    "crates/io/postcard",
    "crates/io/types",
    "crates/instrumentation",
    "crates/model",
    "crates/model-macros",
    "crates/open",
    "crates/stdlib",
    "crates/time",
    "crates/ui",
    "domains/query_engine/analyzer",
    "domains/query_engine/model",
    "domains/query_engine/server",
    "domains/query_engine/ui",
    "examples/legacy/cpp-integration/bridge",
    "domains/query_engine/tests/cpp/instrumentation",
    "domains/query_engine/tests/cpp/bridge",
    "examples/readme",
    "experimental/vibe/simulator/analyzer",
    "experimental/vibe/simulator/application",
    "experimental/vibe/simulator/instrumentation",
    "experimental/vibe/simulator/server",
    "experimental/vibe/simulator/ui",
    "experimental/vibe/simulator/ui-bindings",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
repository = "https://github.com/rapidsai/quent"

[workspace.dependencies]
async-trait = "0.1.89"
bindgen = "0.72"
bitcode = { version = "0.6.9", features = ["serde"] }
cargo_metadata = "0.23"
cc = "1.2"
http = "1"
indexmap = "2"
log = {version = "0.4.28", features = ["kv"]}
nvtx = { version = "2", default-features = false, features = ["std"] }
petgraph = "0.8.3"
postcard = { version = "1", default-features = false, features = ["alloc"] }
prettyplease = "0.3.0"
prost = "0.14.1"
pyo3 = "0.29"
quent-dynamic-attributes = { path = "crates/dynamic-attributes" }
quent-resource = { path = "crates/resource" }
rmp-serde = "1"
rustc-hash = "2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
smallvec = {version = "1.15.1", features = ["serde"] }
syn = { version = "3.0.3", features = ["full", "parsing"] }
thiserror = "2.0.17"
tokio = "1.48.0"
tokio-stream = "0.1.17"
tokio-util = "0.7.18"
tonic = "0.14.2"
tonic-prost = "0.14.2"
tracing = "0.1.43"
tracing-subscriber = "0.3"
ts-rs = "12.0.1"
uuid = {version = "1.18.1", features = ["v7"]}
