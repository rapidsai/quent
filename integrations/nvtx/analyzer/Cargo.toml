[package]
name = "quent-nvtx-analyzer"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
# Enables `tests/roundtrip.rs`, which reconstructs a real in-process capture.
#
# Off by default so the analyzer's normal tests do not need the native
# `nvtx-sys` build toolchain (`libclang` and a C compiler). Run it with
# `pixi run cargo test -p quent-nvtx-analyzer --features real-capture-tests`.
real-capture-tests = [
    "dep:libc",
    "dep:nvtx",
    "dep:nvtx-injection",
    "dep:quent-nvtx-bridge",
    "dep:quent-instrumentation",
]

[dependencies]
# Framework-free: the NVTX vocabulary, the Quent event envelope, and the shared
# time primitives. The shared analysis/modelling crates are excluded by design,
# keeping the panic-prone FSM runtime off this crate's path.
quent-nvtx-events = { path = "../events" }
quent-events = { path = "../../../crates/events" }
quent-time = { path = "../../../crates/time" }
# Same hasher the shared analyzer uses. These keys are process-local NVTX
# handles, never attacker-chosen, so HashDoS resistance buys nothing here.
rustc-hash = { workspace = true }
tracing = { workspace = true }

# Roundtrip-test-only. Optional regular dependencies keep the default analyzer
# build independent of the Linux-only injection toolchain.
quent-nvtx-bridge = { path = "../bridge", optional = true }
libc = { version = "0.2", optional = true }
nvtx = { workspace = true, optional = true }
nvtx-injection = { path = "../injection", features = ["static-injection"], optional = true }
# `io-callback` selects the callback exporter the roundtrip collects through.
quent-instrumentation = { path = "../../../crates/instrumentation", features = [
    "io-callback",
], optional = true }

[dev-dependencies]
uuid = { workspace = true }
