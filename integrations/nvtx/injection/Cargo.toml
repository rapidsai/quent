[package]
name = "nvtx-injection"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]

[[test]]
name = "late_hook"
required-features = ["static-injection"]

[[test]]
name = "shutdown"
required-features = ["static-injection"]
harness = false

[dependencies]
# `tools` exposes NVTX's callback-subscription and injection ABI.
nvtx-sys = { workspace = true, features = ["tools"] }
thiserror = { workspace = true }

[build-dependencies]
# Only Quent's own build script needs this direct `cc` dependency, for the
# `static-injection` strong-symbol shim. `nvtx-sys` also compiles bundled C code.
cc = { workspace = true, optional = true }

[dev-dependencies]
libc = "0.2"
nvtx = { workspace = true }

[features]
# `static-injection` attaches injection in-process at link time. A strong
# `InitializeInjectionNvtx2_fnptr` is linked into the consuming image and points
# at the injection initializer, so that image initializes injection at its
# first NVTX call. Linux-only.
static-injection = ["dep:cc"]
