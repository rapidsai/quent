[package]
name = "quent-nvtx-example"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "nvtx_capture"
path = "src/main.rs"

[dependencies]
nvtx-injection = { path = "../injection", features = ["static-injection"] }
quent-nvtx-bridge = { path = "../bridge" }
quent-nvtx-events = { path = "../events" }
# `io-callback` selects the callback exporter used to print captured events.
quent-instrumentation = { path = "../../../crates/instrumentation", features = [
    "io-callback",
] }
uuid = { workspace = true }
nvtx = { workspace = true }
