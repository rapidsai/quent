[package]
name = "nvtx-example"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "nvtx_capture"
path = "src/main.rs"

[dependencies]
# `static-injection` links a strong `InitializeInjectionNvtx2` so NVTX
# initializes injection in-process at the first NVTX call — no cdylib, no
# NVTX_INJECTION64_PATH.
nvtx-injection = { path = "../injection", features = ["static-injection"] }
nvtx-bridge = { path = "../bridge" }
nvtx-events = { path = "../events" }
quent-instrumentation = { path = "../../../crates/instrumentation" }
quent-io = { path = "../../../crates/io", default-features = false, features = [
    "ndjson",
] }
quent-events = { path = "../../../crates/events" }
uuid = { workspace = true }
# The NVTX producer: a header-only Rust binding that makes the NVTX calls the
# injection layer captures. Self-contained (vendors the NVTX v3 headers).
nvtx = "1.3"

[dev-dependencies]
tempfile = "3"
