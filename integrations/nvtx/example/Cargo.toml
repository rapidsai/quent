[package]
name = "nvtx-example"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "nvtx_capture"
path = "src/main.rs"

[dependencies]
nvtx-injection = { path = "../injection", features = ["static-injection"] }
nvtx-analyzer = { path = "../analyzer" }
nvtx-events = { path = "../events" }
quent-events.workspace = true
quent-store = { path = "../../../crates/store", features = ["io-ndjson"] }
serde = { workspace = true, features = ["derive"] }
libc = "0.2"
# `io-callback` selects the callback exporter used to print (bin) and collect
# (test) captured events.
quent-instrumentation = { path = "../../../crates/instrumentation", features = [
    "io-callback",
    "io-ndjson",
] }
uuid = { workspace = true }
nvtx = { workspace = true }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
quent-instrumentation-build = { path = "../../../crates/instrumentation-build" }
quent-store-build = { path = "../../../crates/store-build" }
quent-yaml = { path = "../../../crates/yaml" }
