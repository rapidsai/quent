name: Rust

on:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/*.proto"
      - "pixi.toml"
      - "pixi.lock"
      - "ui/pnpm-lock.yaml"
      - "ui/package.json"
      - ".github/workflows/rust.yml"
      - "deny.toml"
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/*.proto"
      - "pixi.toml"
      - "pixi.lock"
      - "ui/pnpm-lock.yaml"
      - "ui/package.json"
      - ".github/workflows/rust.yml"
      - "deny.toml"

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: pixi run cargo fmt --all -- --check
      - run: pixi run cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: pixi run cargo test --workspace --all-features --locked --all-targets
      - run: pixi run cargo test -p quent-store --no-default-features --features io-ndjson --locked
      - run: pixi run cargo build --workspace --all-features --locked --release
      - run: pixi run cargo run -p quent-instrumentation-build-example --locked
      - run: pixi run cargo run -p quent-store-build-example --locked

  # Regression gate for `quent-open` backward compatibility: build a viewer for
  # a sidecar pinning the previous quent commit (the PR's base commit, or the
  # parent of the pushed commit), with the quent-open of this tree. A failure
  # means this change breaks `quent open` for existing artifacts — add a
  # compatibility path in the same PR instead of merging the breakage.
  open-compat:
    name: quent-open compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Picking the previous commit on push builds needs the parent of HEAD.
          fetch-depth: 2
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Pick the previous quent commit
        id: previous
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: echo "commit=${BASE_SHA:-$(git rev-parse HEAD~1)}" >> "$GITHUB_OUTPUT"
      - run: pixi run cargo test --package quent-open --locked -- --ignored opens_artifacts_built_by_a_previous_quent_commit
        env:
          QUENT_OPEN_COMPAT_COMMIT: ${{ steps.previous.outputs.commit }}
          QUENT_OPEN_COMPAT_REMOTE: ${{ github.server_url }}/${{ github.repository }}

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          cache: true
      - run: pixi run cargo deny check
