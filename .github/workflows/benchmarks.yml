name: Benchmarks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  benchmark:
    name: Run instrumentation benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          cache: true
      - name: Run instrumentation benchmarks
        run: |
          pixi run --frozen cargo run --release --locked -p quent-bench -- \
            --empty-loop --threads 1,2,4 \
            --output benchmarks/results/current.json
      - name: Upload benchmark report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-report
          path: benchmarks/results/current.json
          if-no-files-found: error

  plot:
    name: Build plot
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          cache: true
      - name: Download benchmark report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-report
          path: benchmarks/results
      - name: Install benchmark plot dependencies
        run: pixi run --frozen pnpm --dir experimental/vibe/bench-plot install --frozen-lockfile
      - name: Build standalone benchmark report
        run: pixi run --frozen pnpm --dir experimental/vibe/bench-plot build:single --results benchmarks/results --output pages/benchmarks/index.html
      - name: Upload benchmark plot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-plot
          path: pages/benchmarks/index.html
          if-no-files-found: error
