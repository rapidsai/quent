name: Deploy Demos to Pages

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/*.proto"
      - "crates/schema/ts/**"
      - "crates/yaml/examples/**/*.yaml"
      - "docs/tutorial/**"
      - "experimental/vibe/simulator/**"
      - "experimental/vibe/ui/**"
      - "experimental/vibe/bench-plot/**"
      - "benchmarks/**"
      - "integrations/nvtx/**"
      - "ui/**"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/demos-pages.yml"
      - ".github/workflows/benchmarks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmark:
    name: Benchmark
    uses: ./.github/workflows/benchmarks.yml

  build:
    name: Build
    needs: benchmark
    if: ${{ !cancelled() && (needs.benchmark.result == 'success' || needs.benchmark.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          cache: true
      - name: Install schema explorer dependencies
        run: pixi run --frozen pnpm --dir experimental/vibe/ui install --frozen-lockfile
      - name: Build schema explorer
        run: pixi run --frozen pnpm --dir experimental/vibe/ui build
        env:
          SCHEMA_EXPLORER_BASE: /quent/schema/
      - name: Install schema explorer test browser
        run: pixi run --frozen pnpm --dir experimental/vibe/ui --filter @quent-experimental/schema-explorer exec playwright install --with-deps chromium
      - name: Test schema explorer production build
        run: pixi run --frozen pnpm --dir experimental/vibe/ui --filter @quent-experimental/schema-explorer test:e2e
        env:
          SCHEMA_EXPLORER_BASE: /quent/schema/
      - name: Install simulator UI dependencies
        run: pixi run --frozen pnpm --dir ui install --frozen-lockfile
      - name: Build simulator
        run: pixi run --frozen pnpm --dir ui demo:build
        env:
          VITE_BASE_PATH: /quent/simulator/
      - name: Build YAML tutorial
        run: pixi run --frozen bash docs/tutorial/build.sh
      - name: Download benchmark plot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-plot
          path: pages/benchmarks
      - name: Assemble Pages artifact
        run: |
          mkdir -p pages/schema pages/simulator pages/tutorial
          cp -R experimental/vibe/ui/schema-explorer/dist/. pages/schema/
          cp -R ui/dist/. pages/simulator/
          cp -R docs/tutorial/book/. pages/tutorial/
      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: pages

  deploy:
    name: Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
