name: Python

on:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/*.py"
      - "**/CMakeLists.txt"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/pyproject.toml"
      - "crates/yaml/examples/**/*.yaml"
      - "pixi.toml"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "**/*.rs"
      - "**/*.py"
      - "**/CMakeLists.txt"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/pyproject.toml"
      - "crates/yaml/examples/**/*.yaml"
      - "pixi.toml"
      - ".github/workflows/python.yml"

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1


permissions:
  contents: read

jobs:
  python:
    name: Python Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Build schema codegen Python tests
        run: |
          pixi run maturin develop --uv -m experimental/vibe/codegen/python/test/bridge/Cargo.toml
      - name: Run schema codegen Python tests
        run: |
          pixi run pytest -v experimental/vibe/codegen/python/test/
      - name: Build schema codegen Python example
        run: |
          pixi run maturin develop --uv -m experimental/vibe/codegen/python/example/readme/bridge/Cargo.toml
      - name: Run schema codegen Python example
        run: |
          pixi run python experimental/vibe/codegen/python/example/readme/main.py
      - name: Type check schema codegen Python example
        run: |
          pixi run ty check experimental/vibe/codegen/python/example/readme/
      - name: Build schema codegen Python tutorials
        run: |
          for manifest in experimental/vibe/codegen/python/example/tutorial/*/bridge/Cargo.toml; do
            pixi run maturin develop --uv -m "$manifest"
          done
      - name: Run schema codegen Python tutorials
        run: |
          for example in experimental/vibe/codegen/python/example/tutorial/*/main.py; do
            pixi run python "$example"
          done
      - name: Type check schema codegen Python tutorials
        run: |
          pixi run ty check experimental/vibe/codegen/python/example/tutorial/
