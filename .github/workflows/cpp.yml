name: C++

on:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/*.cpp"
      - "**/*.h"
      - "**/CMakeLists.txt"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "crates/yaml/examples/**/*.yaml"
      - "experimental/vibe/codegen/**/*.yaml"
      - "pixi.toml"
      - ".github/workflows/cpp.yml"
  pull_request:
    paths:
      - "**/*.rs"
      - "**/*.cpp"
      - "**/*.h"
      - "**/CMakeLists.txt"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "crates/yaml/examples/**/*.yaml"
      - "experimental/vibe/codegen/**/*.yaml"
      - "pixi.toml"
      - ".github/workflows/cpp.yml"

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read
jobs:
  cpp:
    name: C++ Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Test schema codegen C++
        run: pixi run cargo test --manifest-path experimental/vibe/codegen/Cargo.toml -p quent-demo-cpp-test -p quent-cpp-list-test -p quent-codegen-cpp-nvtx-test
      - name: Build and run schema codegen C++ tutorials
        run: |
          for manifest in experimental/vibe/codegen/cpp/example/tutorial/*/bridge/Cargo.toml; do
            tutorial="$(basename "$(dirname "$(dirname "$manifest")")")"
            target_dir="${CARGO_TARGET_DIR:-experimental/vibe/codegen/target}"
            library="${target_dir}/debug/libquent_tutorial_${tutorial//-/_}_cpp_bridge.a"
            executable="${RUNNER_TEMP}/quent-tutorial-${tutorial}"
            pixi run cargo build --manifest-path "$manifest" --locked
            pixi run c++ -Wl,--whole-archive "$library" -Wl,--no-whole-archive \
              -ldl -lpthread -lm -lrt -lutil -o "$executable"
            "$executable"
          done
