name: Markdown

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "crates/yaml/examples/**"
      - "docs/figures/overview.svg"
      - "docs/tutorial/**"
      - "ui/public/logo.svg"
      - ".rumdl.toml"
      - ".github/workflows/markdown.yml"
      - "pixi.toml"
      - "pixi.lock"
  pull_request:
    paths:
      - "**/*.md"
      - "crates/yaml/examples/**"
      - "docs/figures/overview.svg"
      - "docs/tutorial/**"
      - "ui/public/logo.svg"
      - ".rumdl.toml"
      - ".github/workflows/markdown.yml"
      - "pixi.toml"
      - "pixi.lock"

permissions:
  contents: read

jobs:
  markdown:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          cache: true
      - run: pixi run --frozen rumdl check --diff
      - run: pixi run --frozen bash docs/tutorial/build.sh
