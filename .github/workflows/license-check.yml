name: License Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  license-headers:
    name: License Headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Shallow clone makes the hook fall back to HEAD and check nothing.
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          cache: false
      - name: Check SPDX license headers
        run: pixi run pre-commit run verify-copyright --all-files -c .pre-commit-config.ci.yaml
