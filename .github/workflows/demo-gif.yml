name: Demo GIF

on:
  push:
    branches: [main]
    paths-ignore:
      - "ui/docs/screenshots/demo.gif"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-gif-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate README demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          cache: true
      - run: pixi run --frozen pnpm --dir ui install --frozen-lockfile
      - run: pixi run --frozen pnpm --dir ui exec playwright install --with-deps chromium
      - run: pixi run --frozen pnpm --dir ui demo:gif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-gif
          path: ui/docs/screenshots/demo.gif
          retention-days: 7
