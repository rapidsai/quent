name: Demo GIF

on:
  push:
    branches: [main]
    paths-ignore:
      - "ui/docs/screenshots/demo.gif"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-gif-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate README demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          cache: false
      - run: pixi run --frozen pnpm --dir ui install --frozen-lockfile
      - run: pixi run --frozen pnpm --dir ui exec playwright install --with-deps chromium
      - run: pixi run --frozen pnpm --dir ui demo:gif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-gif
          path: ui/docs/screenshots/demo.gif
          retention-days: 7
