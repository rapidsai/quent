name: Demo GIF

on:
  push:
    branches: [main]
    paths-ignore:
      - "ui/docs/screenshots/demo.gif"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-gif-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate README demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          cache: true
      - run: pixi run --frozen pnpm --dir ui install --frozen-lockfile
      - run: pixi run --frozen pnpm --dir ui exec playwright install --with-deps chromium
      - run: pixi run --frozen pnpm --dir ui demo:gif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-gif
          path: ui/docs/screenshots/demo.gif
          retention-days: 7

  update:
    name: Update README demo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: demo-gif
          path: ui/docs/screenshots
      - name: Commit updated demo
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- ui/docs/screenshots/demo.gif; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/docs/screenshots/demo.gif
          git commit -m "docs: refresh demo GIF [skip ci]"
          git -c credential.helper='!f() { echo "username=x-access-token"; echo "password=$GITHUB_TOKEN"; }; f' \
            push origin HEAD:main
