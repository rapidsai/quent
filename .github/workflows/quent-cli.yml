name: Quent CLI

on:
  push:
    branches: [main]
    paths:
      - "experimental/vibe/quent-cli/**"
      - "ui/**"
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/*.proto"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/quent-cli.yml"
  pull_request:
    paths:
      - "experimental/vibe/quent-cli/**"
      - "ui/**"
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/*.proto"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/quent-cli.yml"

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          cache: false
      - run: pixi run --frozen pnpm --dir ui install --frozen-lockfile
      - run: pixi run --frozen pnpm --dir experimental/vibe/quent-cli install --frozen-lockfile
      - run: pixi run --frozen pnpm --dir experimental/vibe/quent-cli check
