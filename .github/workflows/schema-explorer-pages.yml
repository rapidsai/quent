# Generated entirely by coding agents from prompts without human review or refinement.
name: Deploy Demos to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          cache: true
      - name: Install schema explorer dependencies
        run: pixi run --frozen pnpm --dir experimental/vibe/ui install --frozen-lockfile
      - name: Build schema explorer
        run: pixi run --frozen pnpm --dir experimental/vibe/ui build
        env:
          SCHEMA_EXPLORER_BASE: /quent/
      - name: Install simulator UI dependencies
        run: pixi run --frozen pnpm --dir ui install --frozen-lockfile
      - name: Build simulator
        run: pixi run --frozen pnpm --dir ui demo:build
        env:
          VITE_BASE_PATH: /quent/simulator/
      - name: Assemble Pages artifact
        run: |
          mkdir -p pages/simulator
          cp -R experimental/vibe/ui/schema-explorer/dist/. pages/
          cp -R ui/dist/. pages/simulator/
      - name: Set up Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: pages
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
