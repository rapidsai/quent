[package]
name = "quent-simulator-server"
version.workspace = true
edition.workspace =  true
publish.workspace = true
[features]
ui = ["quent-query-engine-server/ui"]
swagger = ["quent-query-engine-server/swagger"]

[dependencies]
axum = { version = "0.8.7" }
clap = { version = "4.5", features = ["derive", "env"] }
nvtx-server = { path = "../../../integrations/nvtx/server" }
quent-io = { path = "../../../crates/io" }
quent-query-engine-server = { path = "../../../domains/query_engine/server" }
quent-simulator-analyzer = { path = "../analyzer" }
quent-simulator-instrumentation = { path = "../instrumentation", features = ["collector"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync"]}
tracing.workspace = true
uuid.workspace = true
