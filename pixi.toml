[workspace]
name = "quent"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64"]
requires-pixi = ">=0.68"

[dependencies]
rust = "=1.97.0"
rust-src = "=1.97.0"
cargo-deny = "=0.20.2"
nodejs = ">=24.11.0"
pnpm = ">=11.19.0"
cmake = ">=3.24"
cxx-compiler = ">=1"
python = ">=3.11,<3.15"
maturin = ">=1.14,<2"
pytest = ">=8,<10"
ty = ">=0.0.55"
uv = ">=0.11.25"
pre-commit = ">=4"
rust-std-wasm32-unknown-unknown = "1.97.0.*"
wasm-bindgen-cli = "0.2.127.*"
mdbook = "0.5.4.*"

[pypi-dependencies]
rumdl = "*"

[target.linux-64.dependencies]
# `nvtx-sys` runs bindgen against its bundled headers during consumer builds.
libclang = ">=18"

[target.linux-aarch64.dependencies]
libclang = ">=18"
# Native aarch64 bindgen needs compiler resource headers. `libclang` does not
# ship them and does not fall back to the conda GCC headers there;
# `clang` pulls `clang-<major>`, which provides them.
clang = ">=18"
